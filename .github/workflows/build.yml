name: Build Ember APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install npm dependencies
        run: npm install

      - name: Copy Phaser to www/lib
        run: |
          mkdir -p www/lib
          cp node_modules/phaser/dist/phaser.min.js www/lib/phaser.min.js
          ls -lh www/lib/

      - name: Add Android platform
        run: npx cap add android

      - name: Set minSdkVersion
        run: sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 24/' android/variables.gradle

      - name: Set App Version
        run: |
          echo "=== BEFORE ==="
          grep -n "versionCode\|versionName" android/app/build.gradle || true
          sed -i 's/versionCode [0-9]\+/versionCode 100/g' android/app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "1.0.0"/g' android/app/build.gradle
          echo "=== AFTER ==="
          grep -n "versionCode\|versionName" android/app/build.gradle || true

      - name: Enable Fullscreen Mode
        run: |
          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/styles.xml << 'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:statusBarColor">#050208</item>
                  <item name="android:navigationBarColor">#050208</item>
              </style>
              <style name="AppTheme.NoActionBar" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>
                  <item name="android:statusBarColor">#050208</item>
                  <item name="android:navigationBarColor">#050208</item>
              </style>
              <style name="AppTheme.NoActionBarLaunch" parent="AppTheme.NoActionBar">
                  <item name="android:background">@drawable/splash</item>
              </style>
          </resources>
          XMLEOF
          cat android/app/src/main/res/values/styles.xml

      - name: Add Landscape Orientation
        run: |
          perl -i -pe 's/(<activity\s+[^>]*android:name="\.MainActivity"[^>]*)(>)/$1 android:screenOrientation="sensorLandscape" android:configChanges="orientation|screenSize|keyboardHidden"$2/ unless /screenOrientation/' android/app/src/main/AndroidManifest.xml
          grep -A2 "<activity" android/app/src/main/AndroidManifest.xml || true

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk "output/EMBER-The-Last-Echo-v1.0.0.apk"
          ls -lh output/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-build${{ github.run_number }}
          name: EMBER - The Last Echo (Build ${{ github.run_number }})
          files: output/EMBER-The-Last-Echo-v1.0.0.apk
          draft: false
          prerelease: false
