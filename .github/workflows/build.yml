name: Build Shadow Blade APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install npm dependencies
      run: npm install

    - name: Add Android platform
      run: npx cap add android

    - name: Set minSdkVersion
      run: |
        sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 24/' android/variables.gradle
        cat android/variables.gradle

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Make gradlew executable
      run: chmod +x android/gradlew

    - name: Build Debug APK
      working-directory: android
      run: ./gradlew assembleDebug --no-daemon

    - name: Rename APK
      run: |
        mkdir -p output
        cp android/app/build/outputs/apk/debug/app-debug.apk output/Shadow-Blade-v1.0.0.apk

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0-build${{ github.run_number }}
        name: Shadow Blade v1.0.0 (Build ${{ github.run_number }})
        files: output/Shadow-Blade-v1.0.0.apk
        draft: false
        prerelease: false
