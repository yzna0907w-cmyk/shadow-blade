  <!-- Top ornament -->
  <path d="M 246 160 L 266 160 L 266 150 L 256 140 L 246 150 Z" fill="#fbbf24"/>
  <!-- Ember particles -->
  <circle cx="180" cy="150" r="4" fill="#ff8c3c" opacity="0.8"/>
  <circle cx="330" cy="180" r="3" fill="#fbbf24" opacity="0.7"/>
  <circle cx="290" cy="120" r="5" fill="#ff3c14" opacity="0.6"/>
  <circle cx="220" cy="130" r="3" fill="#ff8c3c" opacity="0.7"/>
  <circle cx="350" cy="100" r="4" fill="#ffd6a5" opacity="0.5"/>
  <!-- Text EMBER -->
  <text x="256" y="480" text-anchor="middle" font-family="Georgia, serif" font-size="42"
        font-weight="bold" letter-spacing="8" fill="url(#flameG)">EMBER</text>
