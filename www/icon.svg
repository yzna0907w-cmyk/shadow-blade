<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="60%">
      <stop offset="0" stop-color="#2a1505"/>
      <stop offset="0.6" stop-color="#0a0515"/>
      <stop offset="1" stop-color="#050208"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="60%">
      <stop offset="0" stop-color="#ff8c3c" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#ff3c14" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ff3c14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flameG" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0" stop-color="#ffd6a5"/>
      <stop offset="0.4" stop-color="#ff8c3c"/>
      <stop offset="0.8" stop-color="#ff3c14"/>
      <stop offset="1" stop-color="#a01000"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="300" r="200" fill="url(#glow)"/>
  <!-- Lantern body -->
  <path d="M 180 250 Q 180 200 256 200 Q 332 200 332 250 L 340 380 Q 340 420 320 430 L 192 430 Q 172 420 172 380 Z"
        fill="#1a0f2a" stroke="#fbbf24" stroke-width="6"/>
  <path d="M 200 250 L 312 250" stroke="#fbbf24" stroke-width="4"/>
  <path d="M 195 290 L 317 290" stroke="#fbbf24" stroke-width="3" opacity="0.6"/>
  <!-- Flame inside -->
  <path d="M 256 270 Q 230 310 240 350 Q 248 370 256 375 Q 264 370 272 350 Q 282 310 256 270 Z"
        fill="url(#flameG)"/>
  <path d="M 256 300 Q 245 320 250 345 Q 253 355 256 358 Q 259 355 262 345 Q 267 320 256 300 Z"
