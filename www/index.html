<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="screen-orientation" content="landscape">
<title>EMBER — The Last Echo</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Amiri:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="js/core/error-handler.js"></script>
</head>
<body>

<!-- تحذير الاتجاه -->
<div id="rotate-warning">
  <div class="rotate-icon">📱</div>
  <div class="rotate-text">أدر جوالك أفقياً</div>
</div>

<!-- شاشة القصة -->
<div id="storyScreen" class="story-screen">
  <div class="story-vignette"></div>
  <div class="story-scanlines"></div>
  <div class="story-chapter" id="storyChapter">EMBER</div>
  <div class="story-content"><div class="story-text" id="storyText"></div></div>
  <div class="story-controls">
    <button class="story-btn story-btn--skip" id="storySkip" type="button">تخطي</button>
    <button class="story-btn story-btn--next" id="storyNext" type="button">التالي ⟫</button>
  </div>
  <div class="story-hint">المس الشاشة للمتابعة</div>
</div>

<!-- شاشة البداية -->
<div id="title-screen">
  <div class="title-bg"></div>
  <div class="title-ember" id="titleEmber"></div>
  <div class="title-vignette"></div>
  <div class="title-particles" id="titleParticles"></div>
  <div class="title-content">
    <div class="title-logo-area">
      <h1 class="title-name">EMBER</h1>
      <p class="title-sub">The Last Echo · صدى الرماد</p>
    </div>
    <div class="title-menu">
      <button class="menu-btn menu-btn--primary" id="btnNewGame" type="button">🔥 ابدأ الرحلة</button>
      <button class="menu-btn" id="btnContinue" type="button">▶ متابعة</button>
      <button class="menu-btn menu-btn--link" id="btnWebsite" type="button">🌐 الدعم</button>
    </div>
  </div>
</div>

<!-- شاشة طلب البوس -->
<div id="bossPromptScreen" class="modal-screen">
  <div class="modal-box" style="text-align:center">
    <div style="font-size:3rem;margin:10px 0">👑</div>
    <h2 class="modal-title" id="bossPromptName">BOSS</h2>
    <div style="color:#ffb87a;padding:15px 0;font-size:1.1rem">هل أنت مستعد للمواجهة؟</div>
    <button class="modal-btn menu-btn--primary" id="bossAcceptBtn" type="button">⚔ نعم، هيا نواجه!</button>
    <button class="modal-btn modal-btn--close" id="bossDeclineBtn" type="button">⏸ ليس الآن</button>
  </div>
</div>

<!-- HUD -->
<div id="hud" style="display:none">
  <div class="hud-top">
    <div class="hud-item">
      <span class="hud-icon">🔥</span>
      <div class="flame-bar"><div class="flame-fill" id="flameFill"></div></div>
    </div>
    <div class="hud-zone" id="zoneName">المقبرة</div>
    <div class="hud-gold"><span>💰</span><span id="goldCount">0</span></div>
  </div>
</div>

<!-- أزرار التحكم -->
<div id="controls" style="display:none">
  <button class="ctrl-btn ctrl-btn--left" id="btnLeft" type="button">
    <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round"/></svg>
  </button>
  <button class="ctrl-btn ctrl-btn--right" id="btnRight" type="button">
    <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round"/></svg>
  </button>
  <button class="ctrl-btn ctrl-btn--attack" id="btnAttack" type="button">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6" fill="currentColor"/></svg>
  </button>
  <button class="ctrl-btn ctrl-btn--jump" id="btnJump" type="button">
    <svg viewBox="0 0 24 24"><path d="M12 20V6M6 12l6-6 6 6" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round"/></svg>
  </button>
  <button class="ctrl-btn ctrl-btn--dash" id="btnDash" type="button" style="bottom:20px;right:200px;width:60px;height:60px">
    <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round"/></svg>
  </button>
  <button class="ctrl-btn ctrl-btn--switch" id="btnSwitch" type="button" style="top:80px;right:20px;width:50px;height:50px">
    <svg viewBox="0 0 24 24"><path d="M7 7h10M7 7l3-3M7 7l3 3M17 17H7M17 17l-3-3M17 17l-3 3" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
  </button>
</div>

<!-- حاوية اللعبة -->
<div id="game-container"><div id="game-wrap"></div></div>
<div id="loading">🔥</div>
<script>setTimeout(function(){var l=document.getElementById('loading');if(l)l.classList.add('hide');},800);</script>

<!-- ═══════════════════════════════════════════════════════════ -->
<!-- السكربتات — بالترتيب الصحيح (مهم جداً!) -->
<!-- ═══════════════════════════════════════════════════════════ -->

<!-- 0. المكتبة -->
<script src="lib/phaser.min.js"></script>

<!-- 1. الأساسيات (Core) -->
<script src="js/core/error-handler.js"></script>
<script src="js/core/config.js"></script>
<script src="js/core/state.js"></script>
<script src="js/core/events.js"></script>
<script src="js/core/input.js"></script>
<script src="js/core/audio.js"></script>

<!-- 2. البيانات (Data) -->
<script src="js/data/weapons.js"></script>
<script src="js/data/enemies.js"></script>
<script src="js/data/bosses.js"></script>
<script src="js/data/items.js"></script>
<script src="js/data/prices.js"></script>
<script src="js/data/npcs.js"></script>
<script src="js/data/rooms.js"></script>
<script src="js/data/rooms-2-swamp.js"></script>
<script src="js/data/rooms-3-caves.js"></script>
<script src="js/data/rooms-4-forest.js"></script>
<script src="js/data/rooms-5-factory.js"></script>

<!-- 3. الأنظمة (Systems) -->
<script src="js/systems/combat.js"></script>
<script src="js/systems/enemies.js"></script>
<script src="js/systems/bosses.js"></script>
<script src="js/systems/dialogue.js"></script>
<script src="js/systems/inventory.js"></script>
<script src="js/systems/shop.js"></script>
<script src="js/systems/puzzles.js"></script>
<script src="js/systems/hud.js"></script>

<!-- 4. الكائنات (Entities) -->
<script src="js/entities/player.js"></script>

<!-- 5. المراحل (Levels) -->
<script src="js/levels/levels.js"></script>

<!-- 6. القصة -->
<script src="js/story.js"></script>

<!-- 7. الواجهة -->
<script src="js/ui.js"></script>

<!-- 8. الملف الرئيسي (آخر شي!) -->
<script src="js/main.js"></script>

</body>
</html>
