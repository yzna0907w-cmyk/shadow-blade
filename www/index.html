<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Shadow Blade</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="title-screen">
<div class="title-vignette"></div>
<div class="title-particles" id="titleParticles"></div>
<div class="title-content">
<h1 class="title-name">SHADOW<span>BLADE</span></h1>
<p class="title-sub">THE UMBRAL PATH</p>
<div class="title-menu">
<button class="menu-btn menu-btn--primary" id="btnNewGame"><span>⚔ NEW GAME</span></button>
<button class="menu-btn" id="btnContinue"><span>▶ CONTINUE</span></button>
<button class="menu-btn" id="btnSettings"><span>⚙ SETTINGS</span></button>
<button class="menu-btn" id="btnAbout"><span>ℹ ABOUT</span></button>
<button class="menu-btn menu-btn--link" id="btnWebsite"><span>🌐 WEBSITE</span></button>
</div>
<div class="title-gold" id="titleGold">💰 0</div>
</div>
</div>

<div id="settingsScreen" class="modal-screen">
<div class="modal-box">
<h2 class="modal-title">⚙ SETTINGS</h2>
<div class="setting-row"><span class="setting-label">🔊 Master Volume</span><input type="range" min="0" max="100" value="50" id="setMaster" class="setting-slider"><span class="setting-value" id="setMasterVal">50%</span></div>
<div class="setting-row"><span class="setting-label">🎵 Sound Effects</span><input type="range" min="0" max="100" value="70" id="setSFX" class="setting-slider"><span class="setting-value" id="setSFXVal">70%</span></div>
<div class="setting-row"><span class="setting-label">📳 Vibration</span><label class="toggle"><input type="checkbox" id="setVibration" checked><span></span></label></div>
<div class="setting-row"><span class="setting-label">✨ Particles</span><label class="toggle"><input type="checkbox" id="setParticles" checked><span></span></label></div>
<button class="modal-btn modal-btn--close" id="closeSettings">CLOSE</button>
</div>
</div>

<div id="aboutScreen" class="modal-screen">
<div class="modal-box">
<h2 class="modal-title">ℹ ABOUT</h2>
<div style="text-align:center;color:#c4b5fd;line-height:1.8">
<p style="font-size:1.3rem;color:#e879f9">&lt;/&gt; SHADOW BLADE</p>
<p>2D Action Platformer</p>
<p style="color:#fbbf24;font-weight:700">v2.0.0</p>
<p style="font-size:0.75rem;color:#7c7c8a">© 2026 YZ</p>
</div>
<button class="modal-btn modal-btn--close" id="closeAbout">CLOSE</button>
</div>
</div>

<div id="shopScreen" class="modal-screen">
<div class="modal-box">
<h2 class="modal-title">🏪 SHOP</h2>
<div class="shop-gold" id="shopGold">💰 0</div>
<div class="shop-items" id="shopItems"></div>
<button class="modal-btn modal-btn--close" id="closeShop">CLOSE</button>
</div>
</div>

<div id="forgeScreen" class="modal-screen">
<div class="modal-box">
<h2 class="modal-title">⚒ FORGE</h2>
<div class="shop-gold" id="forgeGold">💰 0</div>
<div class="forge-info" id="forgeInfo"></div>
<button class="modal-btn modal-btn--forge" id="doForge">⚒ UPGRADE</button>
<button class="modal-btn modal-btn--close" id="closeForge">CLOSE</button>
</div>
</div>

<div id="game-container">
<div id="game-wrap">
<canvas id="game" width="480" height="270"></canvas>
<div id="hud">
<div class="hud-row">
<div class="hud-item"><span class="hud-label">HP</span><div class="hp-bar"><div class="hp-fill" id="hpFill"></div></div></div>
<div class="hud-item"><span class="hud-label">💰</span><span class="hud-value" id="goldCount">0</span></div>
<div class="hud-item"><span class="hud-label">ZONE</span><span class="hud-value hud-value--level" id="levelName">CRYPT</span></div>
</div>
<div class="hud-row">
<div class="hud-item"><span class="hud-label">☠</span><span class="hud-value" id="killCount">0</span></div>
<div class="hud-item"><span class="hud-label">⚔</span><span class="hud-value" id="weaponLevel">Lv.1</span></div>
<div class="hud-item"><span class="hud-label">🛡</span><span class="hud-value" id="armorLevel">Lv.1</span></div>
</div>
</div>
<div class="pause-btn" id="pauseBtn">II</div>
<div id="controls">
<div class="dpad">
<button class="ctrl-btn" id="btnLeft" type="button">◀</button>
<button class="ctrl-btn" id="btnRight" type="button">▶</button>
</div>
<div class="actions">
<button class="ctrl-btn ctrl-btn--attack" id="btnAttack" type="button">⚔</button>
<button class="ctrl-btn ctrl-btn--jump" id="btnJump" type="button">⬆</button>
</div>
</div>
</div>
</div>

<div id="pauseScreen" class="modal-screen">
<div class="modal-box">
<h2 class="modal-title">II PAUSED</h2>
<button class="modal-btn menu-btn--primary" id="resumeBtn">▶ RESUME</button>
<button class="modal-btn" id="quitBtn">✕ QUIT TO MENU</button>
</div>
</div>

<div id="interactHint" class="interact-hint">TAP TO INTERACT</div>
<div id="loading">LOADING...</div>

<script>
setTimeout(function(){var l=document.getElementById('loading');if(l){l.classList.add('hide');l.style.display='none';}},1000);
</script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
