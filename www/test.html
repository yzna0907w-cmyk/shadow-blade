<!DOCTYPE html>
<html><head><meta charset="UTF-8"></head>
<body style="margin:0;background:#000">
<div id="fps" style="position:fixed;top:10px;left:10px;color:#0f0;font-family:monospace;font-size:20px;z-index:99">FPS: ...</div>
<canvas id="c" width="480" height="270" style="width:100%;height:100vh"></canvas>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
const fpsEl = document.getElementById('fps');
let x = 0, lastT = performance.now(), frames = 0, fps = 0;

function loop(t) {
  frames++;
  const dt = t - lastT;
  if (dt >= 1000) {
    fps = Math.round(frames * 1000 / dt);
    fpsEl.textContent = 'FPS: ' + fps;
    frames = 0;
    lastT = t;
  }
  x = (x + 2) % 480;
  ctx.fillStyle = '#0a0a2a';
  ctx.fillRect(0, 0, 480, 270);
  ctx.fillStyle = '#ff0';
  ctx.fillRect(x, 100, 40, 40);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body></html>
